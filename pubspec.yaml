name: laras
description: "Pemutar musik Android gratis, tanpa iklan, bisa offline."
publish_to: none
version: 0.9.0+1

environment:
  sdk: ^3.13.7
  flutter: "3.47.8"

# Semua versi dipin persis dan diverifikasi di pub.dev pada 15 November 2026.
# Lihat laporan P0 untuk bukti verifikasi tiap versi.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Audio: engine, background service, fokus audio.
  just_audio: 0.10.6
  audio_service: 0.18.19
  audio_session: 0.2.4

  # Database lokal: drift di atas SQLite.
  drift: 2.35.4
  drift_flutter: 0.3.1
  sqlite3: 3.9.1

  # Jaringan dan ekstraksi.
  dio: 5.11.1
  quickjs_engine: 0.1.7

  # Cache sampul dan penyimpanan file.
  cached_network_image_ce: 4.13.2
  path_provider: 2.1.6

  # Pengaturan kecil (11 kunci, nilai primitif saja).
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  drift_dev: 2.35.3
  build_runner: 2.16.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon-background.png"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  min_sdk_android: 26
