name: laras
description: "Pemutar musik Android gratis, tanpa iklan, bisa offline."
publish_to: none
version: 1.0.0+2

environment:
  sdk: ^3.13.7
  flutter: "3.47.8"

# Semua versi dipin persis dan diverifikasi di pub.dev pada 15 November 2026.
# Lihat laporan P0 untuk bukti verifikasi tiap versi.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Audio: engine, background service, fokus audio.
  just_audio: 0.10.6
  audio_service: 0.18.19
  audio_session: 0.2.4

  # Database lokal: drift di atas SQLite.
  drift: 2.35.4
  drift_flutter: 0.3.1
  sqlite3: 3.9.1

  # Jaringan dan ekstraksi.
  dio: 5.11.1
  # Fork R2-M3: gg_quickjs 0.1.0 (pub.dev) masih membundel QuickJS-ng
  # 0.17.0 (2 UAF #1781/#1844 + OOM uncatchable). Fork ini membawa
  # QuickJS-ng 0.18.0 via tool/update-quickjs-ng.js resmi paket.
  # Di-pin ke commit (bukan branch) supaya build reproduksibel;
  # kembali ke upstream bila upstream merilis versi >= 0.18.0.
  # Detail + jalur update: docs/dependencies.md §2.1.
  # 0bb8b583: JSInterruptHandler kini JSContext* (0.18.0 mengubah
  # signature-nya; Clang 16+ menolak pointer JSRuntime* lama).
  gg_quickjs:
    git:
      url: https://github.com/adiprmx/gg_quickjs.git
      ref: 0bb8b583ea543b1bf3687a6a0d36ef0d655f9d89

  # Cache sampul dan penyimpanan file.
  cached_network_image_ce: 4.13.2
  path_provider: 2.1.6

  # Pengaturan kecil (11 kunci, nilai primitif saja).
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Dipakai langsung oleh test/player/sleep_timer_test.dart (P7):
  # tanpa entri ini analyze mengeluh depend_on_referenced_packages.
  # Versi sama dengan yang sudah ada di lock sebagai transitif.
  fake_async: 1.3.3
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  drift_dev: 2.35.3
  build_runner: 2.16.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/
    - assets/privacy_policy_id.md

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon-background.png"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  min_sdk_android: 26
