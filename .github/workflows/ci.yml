# CI: analyze, test, and debug APK build on every push and pull request.
# Flutter is pinned to 3.47.8. Bumping it is a deliberate change, not automatic.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.8
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Plain `flutter analyze` exits non-zero on any error or warning.
      # Infos do not fail the build. Zero warnings is the project rule (K13).
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK (split per ABI)
        run: flutter build apk --debug --split-per-abi

      - name: Check APK size (max 25 MB each)
        run: |
          MAX_BYTES=$((25 * 1024 * 1024))
          FAILED=0
          for apk in build/app/outputs/flutter-apk/*.apk; do
            SIZE=$(stat -c%s "$apk")
            echo "$apk: $SIZE bytes"
            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              echo "::error file=$apk::APK is $SIZE bytes, over the 25 MB limit"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more APKs exceed 25 MB. Shrink the app before merging."
            exit 1
          fi

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: laras-debug-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
