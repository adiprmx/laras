# CI: analyze, test, and APK builds on every push and pull request.
# Flutter is pinned to 3.47.8. Bumping it is a deliberate change, not automatic.
#
# Supply chain (R1-L5): every action is pinned to a full commit SHA, not a
# mutable tag — a tag can be moved to different code after review, a SHA
# cannot. The tag each SHA corresponds to is kept in a trailing comment;
# SHAs were verified against the GitHub API (16 Nov 2026). To update an
# action, look up the new tag's SHA and change both the SHA and the comment.
#
# Size rule (K4): the 25 MB per-ABI limit applies to the RELEASE APK, the
# artifact users install. Debug APKs are far larger by design (unstripped
# engine, JIT, debug symbols — run 43728749979 measured 90.3 MB arm64-v8a,
# 68.7 MB armeabi-v7a, 76.4 MB x86_64 for the skeleton), so their sizes are
# reported only and never gate the build.
#
# ABIs shipped: arm64-v8a + armeabi-v7a only (K-F2-11). x86_64 was dropped
# after P3: it is an emulator-only ABI, and its release APK had reached
# 26,161,237 bytes — 53,163 bytes under the limit, a breach waiting for
# the next package. Real phones are arm64/armeabi-v7a.
#
# Release builds use --obfuscate with split debug info (K-F2-11):
# obfuscation shrinks libapp.so (the biggest APK entry after the engine),
# and the symbols artifact keeps stack traces symbolizable.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-gradle-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # R3-I4 (residu R2-L6): memvalidasi checksum gradle-wrapper.jar
      # terhadap daftar resmi Gradle, supaya jar yang diganti diam-diam
      # di commit masa depan langsung ketahuan. SHA diverifikasi via
      # GitHub API 17 Nov 2026 (tag v6.4.1 -> commit di bawah).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.8
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Plain `flutter analyze` exits non-zero on any error or warning.
      # Infos do not fail the build. Zero warnings is the project rule (K13).
      - name: Analyze
        run: flutter analyze

      # Live tests (tag `live`) call real InnerTube + GitHub Releases and
      # are excluded from CI: they depend on YouTube network access and
      # would be flaky in CI. Run them explicitly:
      # flutter test --tags live
      - name: Test
        run: flutter test --exclude-tags live

      - name: Build debug APK (split per ABI)
        run: flutter build apk --debug --split-per-abi --target-platform android-arm,android-arm64

      # Debug APKs are larger by design (unstripped engine, JIT, debug
      # symbols). Their sizes are reported for visibility and never fail
      # the build — the 25 MB limit gates the release APK below.
      - name: Report debug APK sizes
        run: |
          for apk in build/app/outputs/flutter-apk/*-debug.apk; do
            echo "$apk: $(stat -c%s "$apk") bytes"
          done

      # Release build for size measurement only. No key.properties exists
      # in CI, so Gradle falls back to debug signing (see
      # android/app/build.gradle.kts) — these APKs are NOT for
      # distribution. Proper release signing arrives in P10.
      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols

      # K4: release APK, max 25 MB per ABI.
      - name: Check release APK size (max 25 MB each)
        run: |
          MAX_BYTES=$((25 * 1024 * 1024))
          FAILED=0
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            SIZE=$(stat -c%s "$apk")
            echo "$apk: $SIZE bytes"
            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              echo "::error file=$apk::APK is $SIZE bytes, over the 25 MB limit"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more release APKs exceed 25 MB. Shrink the app before merging."
            exit 1
          fi

      # Largest entries inside the arm64 release APK, so a size regression
      # points at its cause (native lib, DEX, assets) in the log itself.
      - name: APK contents breakdown (release arm64)
        run: |
          unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | sort -k1 -n -r | head -25

      - name: Upload debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laras-debug-apks
          path: build/app/outputs/flutter-apk/*-debug.apk
          retention-days: 14

      - name: Upload release APKs (debug-signed, measurement only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laras-release-apks-debug-signed
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14

      # Obfuscation mapping for this build, so a crash stack trace from
      # the demo APK can be symbolized with `flutter symbolize`.
      - name: Upload debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laras-release-symbols
          path: build/app/outputs/symbols
          retention-days: 14
