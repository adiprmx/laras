# Release: build signed release APKs and an AAB when a v* tag is pushed,
# then publish a GitHub Release with SHA-256 checksums.
#
# Release-candidate mode (P10): the same job can be started by hand from
# the Actions tab (workflow_dispatch, input `version`, default "1.0.0").
# A dispatch run builds, signs and checksums EXACTLY like a tag run, but
# it does NOT publish anything: the "Build release notes" and "Publish
# GitHub Release" steps are skipped, and the APKs, AAB, debug symbols and
# SHA256SUMS are uploaded as a workflow artifact instead
# (laras-release-candidate-<version>). The version input only names the
# artifact; the app version itself comes from pubspec.yaml. The RC is the
# release gate: the owner tries the RC APK first, and only after approval
# does the coordinator push the v* tag that publishes the real release.
# On a tag push (v*), behaviour is UNCHANGED (full publication).
#
# Supply chain (R1-L5): every action is pinned to a full commit SHA, not a
# mutable tag (see the header comment in ci.yml for the rationale).
#
# ABIs shipped: arm64-v8a + armeabi-v7a only (K-F2-11). x86_64 was dropped
# after P3: emulator-only ABI, 53,163 bytes under the 25 MB limit.
# Release APKs and the AAB are obfuscated; the debug symbols for both are
# published with the release so crash stack traces stay symbolizable.
#
# Signing secrets (created in P10, before the first release):
#   ANDROID_KEYSTORE_BASE64    - base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  - keystore password
#   ANDROID_KEY_ALIAS          - key alias inside the keystore
#   ANDROID_KEY_PASSWORD       - key password
# The job fails with a clear message if any of these is missing.
#
# The Android signing config itself (key.properties wiring in
# android/app/build.gradle.kts) is added when the android/ folder is generated
# with `flutter create` and merged. This workflow only supplies the keystore
# file and key.properties; it does not edit the Gradle build.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release candidate version (names the artifact only; app version comes from pubspec.yaml)"
        required: false
        default: "1.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build signed APKs and AAB (publish on tag, RC artifact on dispatch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$KEYSTORE_BASE64" ] && MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && MISSING="$MISSING ANDROID_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing signing secrets:$MISSING"
            echo "Create them in the repo settings (Settings, Secrets and variables, Actions) before tagging a release. See P10."
            exit 1
          fi
          echo "All signing secrets are present."

      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.8
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Live tests (tag `live`) are excluded here as in CI: they call
      # real InnerTube + GitHub Releases and would be flaky in CI.
      - name: Test
        run: flutter test --exclude-tags live

      - name: Prepare signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols

      # R1-L6: the AAB is obfuscated like the APKs, with its own split
      # debug info (symbols-aab) so AAB crash traces stay symbolizable.
      - name: Build release AAB
        run: flutter build appbundle --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols-aab

      - name: Check APK size (max 25 MB each)
        run: |
          MAX_BYTES=$((25 * 1024 * 1024))
          FAILED=0
          for apk in build/app/outputs/flutter-apk/*.apk; do
            SIZE=$(stat -c%s "$apk")
            echo "$apk: $SIZE bytes"
            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              echo "::error file=$apk::APK is $SIZE bytes, over the 25 MB limit"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more APKs exceed 25 MB. Shrink the app before releasing."
            exit 1
          fi

      - name: Archive debug symbols
        run: |
          cd build/app/outputs
          zip -qr flutter-apk/symbols.zip symbols
          zip -qr flutter-apk/symbols-aab.zip symbols-aab
          ls -la flutter-apk/symbols.zip flutter-apk/symbols-aab.zip

      - name: Compute SHA-256 checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum *.apk symbols.zip symbols-aab.zip > SHA256SUMS.txt
          cd ../bundle/release
          sha256sum *.aab >> ../../flutter-apk/SHA256SUMS.txt
          cat ../../flutter-apk/SHA256SUMS.txt

      - name: Build release notes
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="RELEASE_NOTES.md"
          {
            echo "# Laras $GITHUB_REF_NAME"
            echo ""
            awk -v ver="## [$VERSION]" '
              $0 == ver { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > /tmp/changelog-section.txt
            if [ -s /tmp/changelog-section.txt ]; then
              cat /tmp/changelog-section.txt
            else
              echo "See CHANGELOG.md for details."
            fi
            echo ""
            echo "## SHA-256 checksums"
            echo ""
            echo '```'
            cat build/app/outputs/flutter-apk/SHA256SUMS.txt
            echo '```'
          } > "$NOTES"
          cat "$NOTES"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Laras $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            build/app/outputs/flutter-apk/*.apk \
            build/app/outputs/bundle/release/*.aab \
            build/app/outputs/flutter-apk/symbols.zip \
            build/app/outputs/flutter-apk/symbols-aab.zip \
            build/app/outputs/flutter-apk/SHA256SUMS.txt

      # Release-candidate mode only (workflow_dispatch): nothing is
      # published. The signed APKs, AAB, symbols and checksums go to a
      # workflow artifact for the owner to try before any tag is pushed.
      - name: Upload release candidate artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laras-release-candidate-${{ inputs.version }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/symbols.zip
            build/app/outputs/flutter-apk/symbols-aab.zip
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 30
