# Release: build signed release APKs and an AAB when a v* tag is pushed,
# then publish a GitHub Release with SHA-256 checksums.
#
# Signing secrets (created in P10, before the first release):
#   ANDROID_KEYSTORE_BASE64    - base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  - keystore password
#   ANDROID_KEY_ALIAS          - key alias inside the keystore
#   ANDROID_KEY_PASSWORD       - key password
# The job fails with a clear message if any of these is missing.
#
# The Android signing config itself (key.properties wiring in
# android/app/build.gradle.kts) is added when the android/ folder is generated
# with `flutter create` and merged. This workflow only supplies the keystore
# file and key.properties; it does not edit the Gradle build.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed APKs and AAB, publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Check signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$KEYSTORE_BASE64" ] && MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && MISSING="$MISSING ANDROID_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing signing secrets:$MISSING"
            echo "Create them in the repo settings (Settings, Secrets and variables, Actions) before tagging a release. See P10."
            exit 1
          fi
          echo "All signing secrets are present."

      - name: Set up Java 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.8
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Check APK size (max 25 MB each)
        run: |
          MAX_BYTES=$((25 * 1024 * 1024))
          FAILED=0
          for apk in build/app/outputs/flutter-apk/*.apk; do
            SIZE=$(stat -c%s "$apk")
            echo "$apk: $SIZE bytes"
            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              echo "::error file=$apk::APK is $SIZE bytes, over the 25 MB limit"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more APKs exceed 25 MB. Shrink the app before releasing."
            exit 1
          fi

      - name: Compute SHA-256 checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum *.apk > SHA256SUMS.txt
          cd ../../bundle/release
          sha256sum *.aab >> ../../flutter-apk/SHA256SUMS.txt
          cat ../../flutter-apk/SHA256SUMS.txt

      - name: Build release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="RELEASE_NOTES.md"
          {
            echo "# Laras $GITHUB_REF_NAME"
            echo ""
            awk -v ver="## [$VERSION]" '
              $0 == ver { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > /tmp/changelog-section.txt
            if [ -s /tmp/changelog-section.txt ]; then
              cat /tmp/changelog-section.txt
            else
              echo "See CHANGELOG.md for details."
            fi
            echo ""
            echo "## SHA-256 checksums"
            echo ""
            echo '```'
            cat build/app/outputs/flutter-apk/SHA256SUMS.txt
            echo '```'
          } > "$NOTES"
          cat "$NOTES"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Laras $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            build/app/outputs/flutter-apk/*.apk \
            build/app/outputs/bundle/release/*.aab \
            build/app/outputs/flutter-apk/SHA256SUMS.txt
